name: Omniguard Secret Scan
run-name: Omniguard Secret Scan ${{ github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    # Weekly: every Tuesday at 20:00 UTC — runs only if the default branch was pushed in the last 7 days
    - cron: '0 20 * * 2'
    # Monthly: 1st of the month at 20:00 UTC — always runs
    - cron: '0 20 1 * *'

jobs:
  secret-scan:
    name: Omniguard Secret Scan
    permissions:
      contents: read
      issues: write
    uses: omnisend/omniguard-cli/.github/workflows/omniguard-security-scan.yml@master
    secrets: inherit
    with:
      scan_scope: secrets-only
      # Weekly cron passes max_age_days=7 so stale repos are skipped; monthly cron and workflow_dispatch leave it at 0 (always scan).
      max_age_days: ${{ github.event.schedule == '0 20 * * 2' && 7 || 0 }}
