name: Omniguard Fix
run-name: Omniguard Fix ${{ github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      github_issues:
        type: string
        description: GitHub issue selectors (e.g. 1,2,3 or 1-3 or all or storage,handler,client,producer,domain,application or 5,8,client,producer,10-15)
        required: true

jobs:
  omniguard-fix:
    name: Omniguard Fix
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: omnisend/omniguard-cli/.github/workflows/omniguard-fix.yml@master
    with:
      github_issues: ${{ inputs.github_issues }}
